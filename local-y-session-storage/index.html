<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../mifavicon.png">
    <title>Juego de Memoria | Almacenamiento Web</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header class="main-header">
        <h1>Juego de Memoria</h1>
        <p>Cuadrícula de 6×5 para emparejar colores con drag-and-drop, temporizador y guardado automático de partida con localStorage.</p>
    </header>

    <main class="main-container">  
        <a href="../index.html" class="back-link">← Volver al menú</a>
              
        <section class="memory-container">
            <!-- Encabezado de estado y temporizador -->
            <div class="game-header">
                <span id="pairsCounter" class="status-badge">Parejas: 0 / 15</span>
                <span id="timerDisplay" class="status-badge">Tiempo: 0s</span>
            </div>

            <!-- Cuadrícula 6x5 generada dinámicamente desde JS -->
            <div id="memoryGrid" class="memory-grid"></div>

            <!-- Mensaje de victoria y reinicio -->
            <p id="winMessage" class="win-message"></p>
            <button id="resetBtn" type="button" class="btn-reset">Nuevo Juego</button>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <img src="../mifavicon.png" alt="Logo Fer Mamone" class="footer-logo">
            <p>Desarrollado con 💜 por <span>María Fernanda Mamone</span></p>
        </div>
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
